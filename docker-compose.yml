# Dev and demo stack: infrastructure plus API, worker, and frontend.
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Optional: watch the topics live. `docker compose --profile tools up -d redpanda-console`
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    profiles: ["tools"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk -X brokers=redpanda:9092 topic create kea.events.raw kea.engine.updates
        -p 1 -r 1 -c retention.ms=3600000 || true

  neo4j:
    image: neo4j:5.26.30-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1'"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--no-dev", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      RUN_WORKER_IN_API: "false"
      # LLM: values come from the host .env at run time; the key is never baked into an image
      LLM_PROVIDER: ${LLM_PROVIDER:-template}
      LLM_MODEL: ${LLM_MODEL:-CHANGE_ME}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      LLM_CACHE_MODE: ${LLM_CACHE_MODE:-off}
      LLM_CACHE_DIR: /data/llm-cache
      AUTO_INVESTIGATE: ${AUTO_INVESTIGATE:-true}
    volumes:
      - ./.llm-cache:/data/llm-cache
      - ./eval_results:/app/eval_results
    depends_on:
      redpanda:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 5s
      timeout: 8s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--no-dev", "python", "-m", "app.stream.worker"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    depends_on:
      redpanda:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_FIXTURE_MODE: ${NEXT_PUBLIC_FIXTURE_MODE:-0}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  neo4j_data:
